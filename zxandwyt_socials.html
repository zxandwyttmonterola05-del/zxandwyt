<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0a0a">
  <title>@zxandwyt — Socials</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #fff;
      background:
        radial-gradient(circle at 50% 0%, #292929 0%, #111 32%, #050505 75%);
      font-family: Arial, Helvetica, sans-serif;
      overflow-x: hidden;
    }

    .card {
      width: min(430px, 100%);
      text-align: center;
      padding: 42px 26px 30px;
      border: 1px solid #333;
      border-radius: 28px;
      background: rgba(16, 16, 16, .86);
      box-shadow: 0 24px 70px rgba(0,0,0,.65);
      backdrop-filter: blur(14px);
    }

    .avatar {
      width: 92px;
      height: 92px;
      margin: 0 auto 20px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -2px;
      color: #111;
      background: #fff;
      border: 3px solid #555;
      box-shadow: 0 0 0 7px #191919;
    }

    h1 {
      font-size: 28px;
      letter-spacing: -1px;
      margin-bottom: 7px;
    }

    .handle {
      color: #aaa;
      font-size: 15px;
      margin-bottom: 10px;
    }

    .bio {
      color: #777;
      font-size: 13px;
      margin-bottom: 30px;
    }

    .social {
      display: flex;
      align-items: center;
      gap: 16px;
      width: 100%;
      padding: 15px 18px;
      margin: 12px 0;
      color: #fff;
      text-decoration: none;
      border: 1px solid #363636;
      border-radius: 17px;
      background: #171717;
      transition: transform .2s ease, background .2s ease, border-color .2s ease;
    }

    .social:hover {
      transform: translateY(-3px);
      background: #242424;
      border-color: #666;
    }

    .icon {
      width: 38px;
      height: 38px;
      flex: 0 0 38px;
      display: grid;
      place-items: center;
      color: #fff;
    }

    .icon svg {
      width: 31px;
      height: 31px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
    }

    .tiktok svg .fill {
      fill: currentColor;
      stroke: none;
    }

    .label {
      flex: 1;
      text-align: left;
      font-weight: 700;
      font-size: 15px;
    }

    .arrow {
      color: #777;
      font-size: 21px;
      transition: transform .2s ease;
    }

    .social:hover .arrow { transform: translateX(4px); color: #fff; }

    footer {
      margin-top: 28px;
      color: #555;
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    @media (max-width: 420px) {
      .card { padding: 36px 20px 26px; }
      h1 { font-size: 25px; }
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="avatar">ZX</div>

    <h1>Zxan Dwytt</h1>
    <div class="handle">@zxandwyt</div>
    <div class="bio">Connect with me</div>

    <!-- Instagram -->
    <a class="social"
       href="https://www.instagram.com/zxandwyt/"
       target="_blank"
       rel="noopener noreferrer"
       aria-label="Open Zxan Dwytt on Instagram">
      <span class="icon">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="5"></rect>
          <circle cx="12" cy="12" r="4.2"></circle>
          <circle cx="17.4" cy="6.7" r="1" fill="currentColor" stroke="none"></circle>
        </svg>
      </span>
      <span class="label">Instagram</span>
      <span class="arrow">›</span>
    </a>

    <!-- TikTok -->
    <a class="social"
       href="https://www.tiktok.com/@zxandwyt"
       target="_blank"
       rel="noopener noreferrer"
       aria-label="Open Zxan Dwytt on TikTok">
      <span class="icon tiktok">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path class="fill" d="M15.2 3c.25 2.1 1.45 3.45 3.5 3.6v3.05c-1.48.08-2.7-.34-3.5-.87v6.35c0 3.32-2.12 5.47-5.23 5.47-3.04 0-5.27-2.08-5.27-4.96 0-3.1 2.5-5.14 5.56-4.72v3.05c-1.38-.2-2.45.43-2.45 1.6 0 .93.7 1.64 1.67 1.64 1.08 0 1.72-.76 1.72-2.07V3h4z"/>
        </svg>
      </span>
      <span class="label">TikTok</span>
      <span class="arrow">›</span>
    </a>

    <footer>© 2026 Zxan Dwytt</footer>
  </main>
</body>
</html>
